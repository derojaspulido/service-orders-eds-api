
services:
  postgres_service_orders:
    image: postgres:16
    container_name: postgres_service_orders
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  backend_service_orders:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_service_orders
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_service_orders:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      postgres_service_orders:
        condition: service_healthy
